plugins {
	id 'fabric-loom' version '0.10-SNAPSHOT'
	id 'maven-publish'
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

archivesBaseName = "Manningham Mills"
group = "xyz.bluspring.fork"
version = "2.5.2"

minecraft {
	refmapName = "mixins.mm_kilt.refmap.json"
	//AT = file("example/resources/access-transformations.txt")
}

dependencies {
	minecraft "com.mojang:minecraft:1.14"
	mappings "net.fabricmc:yarn:1.14+build.21"
	modCompileOnly "net.fabricmc:fabric-loader:0.10.0+build.208"
}

processResources {
	inputs.property("version", project.version)
	filesMatching("fabric.mod.json") {
		expand([
		    "version": project.version
		])
	}
}

sourceSets {
	main {
		java {
			srcDir 'src'
		}
		resources {
			srcDir 'resources'
		}
	}
//	example {
//		compileClasspath += main.compileClasspath + main.output
//		annotationProcessorPath = main.annotationProcessorPath
//		java {
//			srcDir 'example/src'
//		}
//		resources {
//			srcDir 'example/resources'
//			exclude "access-transformations.txt"
//		}
//	}
}

//jar {
//	AT.include = false
//}

//task exampleJar(type: RemappingJar, dependsOn: exampleClasses) {
//	classifier = "example"
//	from sourceSets.example.output
//}

task sourcesJar(type: Jar, dependsOn: classes) {
	classifier = "sources"
	from sourceSets.main.allSource
}

//task exampleSourcesJar(type: RemappingJar, dependsOn: exampleClasses) {
//	classifier = "example-sources"
//	from sourceSets.example.allSource
//}

//build.dependsOn exampleJar, exampleSourcesJar

artifacts {
	archives(remapJar) {
		builtBy remapJar
	}
//	archives(exampleJar) {
//		builtBy exampleJar
//	}
	archives(sourcesJar) {
		builtBy sourcesJar
	}
//	archives(exampleSourcesJar) {
//		builtBy exampleSourcesJar
//	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			url = uri("https://mvn.devos.one/releases")
			credentials {
				username = System.getenv()["MAVEN_USER"]
				password = System.getenv()["MAVEN_PASS"]
			}
		}
	}
}